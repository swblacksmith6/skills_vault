<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--green:#16a34a;--amber:#d97706;--red:#dc2626;--grey:#6b7280;--blue:#93c5fd;--bg:#f9fafb;--text:#111827;--line:#e5e7eb;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 60px}
header{background:var(--card);border-bottom:3px solid var(--text);padding:22px 0 18px;margin-bottom:22px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.4px}
.sub{color:var(--grey);font-size:13px;margin-bottom:14px}
.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kv{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 11px;font-size:13px}
.kv b{display:block;font-size:15px;font-weight:650}
.kv span{color:var(--grey);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.badge{display:inline-block;padding:8px 16px;border-radius:5px;font-weight:700;font-size:15px;letter-spacing:.5px;color:#fff}
.b-green{background:var(--green)} .b-amber{background:var(--amber)} .b-red{background:var(--red)} .b-grey{background:var(--grey)}
h2{font-size:19px;margin:34px 0 4px;padding-bottom:7px;border-bottom:2px solid var(--text)}
h3{font-size:15px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:14px 0}
.card>:first-child{margin-top:0}.card>:last-child{margin-bottom:0}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f3f4f6;font-weight:650;font-size:12.5px}
tbody tr:nth-child(even){background:#fcfcfd}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.g{background:#dcfce7} .a{background:#fef3c7} .r{background:#fee2e2} .n{background:#f3f4f6}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:700;letter-spacing:.3px;color:#fff;white-space:nowrap}
.t-g{background:var(--green)} .t-a{background:var(--amber)} .t-r{background:var(--red)} .t-n{background:var(--grey)}
.cite{color:var(--grey);font-size:11.5px;display:block;margin-top:3px}
.callout{border-left:4px solid var(--red);background:#fef2f2;padding:12px 16px;border-radius:0 5px 5px 0;margin:12px 0}
.callout.green{border-left-color:var(--green);background:#f0fdf4}
.callout.amber{border-left-color:var(--amber);background:#fffbeb}
.callout.grey{border-left-color:var(--grey);background:#f3f4f6}
.callout h4{margin:0 0 8px;font-size:14px}
.callout>:last-child{margin-bottom:0}
.callout ol,.callout ul{margin:0;padding-left:20px}
.callout li{margin-bottom:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px 15px}
.stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--grey)}
.stat .val{font-size:25px;font-weight:700;line-height:1.2;margin:3px 0}
.stat .note{font-size:12px;color:var(--grey)}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin:14px 0}
.chartbox h4{margin:0 0 4px;font-size:14px}
.chartbox p{margin:0 0 10px;font-size:12.5px;color:var(--grey)}
.cw{position:relative}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.two>.chartbox{margin:0}
@media(max-width:760px){.two{grid-template-columns:1fr}}
details{background:var(--card);border:1px solid var(--line);border-radius:6px;margin:10px 0}
summary{cursor:pointer;padding:12px 16px;font-weight:650;font-size:14px}
details[open] summary{border-bottom:1px solid var(--line)}
details pre{margin:0;padding:16px;overflow-x:auto;white-space:pre-wrap;word-wrap:break-word;font-size:12px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:640px;overflow-y:auto}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--grey)}
.small{font-size:12.5px;color:var(--grey)}
blockquote,.q{font-style:italic;border-left:3px solid var(--line);padding-left:12px;margin:8px 0;color:#374151}
@media print{body{background:#fff}.chartbox,.card,.stat,details{break-inside:avoid}details{display:block}details>div{display:block!important}}
.disc{position:sticky;top:0;z-index:1000;background:#fee2e2;border-bottom:3px solid #dc2626;color:#b91c1c;font-weight:800;text-align:center;padding:9px 14px;font-size:14px;line-height:1.4;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.disc b{color:#991b1b;text-transform:uppercase;letter-spacing:.3px}
.disc-foot{margin:28px 0 0;border:3px solid #dc2626;background:#fee2e2;color:#b91c1c;font-weight:800;font-size:15px;padding:14px 18px;border-radius:6px;text-align:center}
.hist{margin-top:10px;font-size:13px;color:var(--grey)}
.hist a{color:#0f766e;margin-right:10px}
@media print{.disc{position:static}}
</style>
</head>
<body>
__DISCLAIMER_TOP__
__BODY__
<script>__CHARTJS__</script>
<script>
(function(){
  if (typeof Chart === 'undefined') return;
  Chart.defaults.font.family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
  Chart.defaults.font.size=11.5;
  Chart.defaults.color='#111827';
  var CFG = __CHARTS__;
  Object.keys(CFG).forEach(function(id){
    var el = document.getElementById(id);
    if (!el) return;
    var cfg = CFG[id];
    cfg.options = cfg.options || {};
    cfg.options.responsive = true;
    cfg.options.maintainAspectRatio = false;
    try { new Chart(el, cfg); } catch(e) { console.error('chart '+id, e); }
  });
})();
</script>
</body>
</html>
